name: Dinedeals
options:
  bundleIdPrefix: dev.dishdeals
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    WEBSITE_URL: "https://replace-with-your-web-host.example"
    BACKEND_URL: "https://replace-with-your-deployment.convex.cloud"
    APP_GROUP: group.dev.dishdeals
    KEYCHAIN_GROUP: "$(AppIdentifierPrefix)dev.dishdeals.shared"
targets:
  Dinedeals:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dishdeals.app
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP)"]
        keychain-access-groups: ["$(KEYCHAIN_GROUP)"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dinedeals
        UILaunchScreen: {}
        WebsiteURL: "$(WEBSITE_URL)"
        BackendURL: "$(BACKEND_URL)"
        AppGroup: "$(APP_GROUP)"
        KeychainGroup: "$(KEYCHAIN_GROUP)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [dinedeals]
    dependencies:
      - target: ReelShare
        embed: true
  ReelShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      - path: ../public/fonts/figtree.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dishdeals.app.ReelShare
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: ShareExtension/Share.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP)"]
        keychain-access-groups: ["$(KEYCHAIN_GROUP)"]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Dinedeals
        BackendURL: "$(BACKEND_URL)"
        AppGroup: "$(APP_GROUP)"
        KeychainGroup: "$(KEYCHAIN_GROUP)"
        UIAppFonts: [figtree.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
